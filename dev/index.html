<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>7 Wonders Duel — dev harness</title>
    <style>
      body {
        margin: 0;
        font:
          13px system-ui,
          sans-serif;
        background: #1d1d22;
        color: #ddd;
      }
      header {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 6px 10px;
        background: #111;
      }
      header input {
        width: 5em;
      }
      #status {
        margin-left: auto;
        opacity: 0.7;
      }
      main {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 40vh;
        gap: 4px;
        height: calc(100vh - 36px);
      }
      figure {
        margin: 0;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      figcaption {
        padding: 2px 8px;
        background: #2a2a31;
      }
      iframe {
        flex: 1;
        border: 0;
        background: #fff;
        min-height: 0;
      }
      figure.spectator {
        grid-column: 1 / 3;
      }
    </style>
  </head>
  <body>
    <header>
      <label>seed <input id="seed" value="7" /></label>
      <button id="new">New game</button>
      <label>steps <input id="steps" value="10" /></label>
      <button id="advance">Advance</button>
      <button id="reload">Reload frames</button>
      <span id="status"></span>
    </header>
    <main>
      <figure>
        <figcaption>Seat 1 — One</figcaption>
        <iframe id="frame-1"></iframe>
      </figure>
      <figure>
        <figcaption>Seat 2 — Two</figcaption>
        <iframe id="frame-2"></iframe>
      </figure>
      <figure class="spectator">
        <figcaption>Spectator</figcaption>
        <iframe id="frame-spectator"></iframe>
      </figure>
    </main>
    <script type="module" src="./host.ts"></script>
  </body>
</html>
